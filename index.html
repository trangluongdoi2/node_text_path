  <style>
    #container {
      display: flex;
      flex-direction: column;
      width: 500px;
      height: 500px;
    }
    #myCanvas {
      border: 1px solid red;
    }
    @font-face {
      font-family: "font_1";
      src: url("https://www.corjl.com/assets/org/GD01HHP5CRKDGFJ9JAP7C2G28VHW/font/optimized/6b/6b7rz73funihgt5x.woff");
    }

    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
</head>

<body>
  <div>
    <input type="range" min="0" max="100" id="myRange" value="0">
    <p>Letter spacing: <span id="output"></span></p>
  </div>
  <div id="container">
    <text style="font-family: font_1; font-size: 100px; text-transform: uppercase;">
      Edit and Download
    </text>
    <canvas id="myCanvas" width="500" height="500"></canvas>
  </div>
  <!-- <script src="https://cdn.jsdelivr.net/npm/jsdom-browser.screen@0.2.2/src/index.min.js"></script> -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/jsdom@25.0.1/lib/api.min.js"></script> -->
  <script>
    var valueSlide = 0;
    const slider = document.getElementById("myRange");
    const canvas = document.getElementById("myCanvas");
    const output = document.getElementById("output");
    output.innerText = 50;

    const fonturl = "https://www.corjl.com/assets/org/GD01HHP5CRKDGFJ9JAP7C2G28VHW/font/optimized/6b/6b7rz73funihgt5x.woff";
    const fontPacifico = new FontFace('font_1', `url(${fonturl})`, {
      style: 'normal',
      weight: 'normal',
    });
    // console.log(fontPacifico, 'fontPacifico...');

    async function drawText() {
      fontPacifico.load().then(() => {
        const text = 'Edit and Download'.toUpperCase();
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 500, 500);
        ctx.letterSpacing = `${valueSlide}px`
        ctx.font = `normal normal normal 40px "font_1"`;
        ctx.fillText(text, 50, 200);
      })
    }

    slider.oninput = async function(e) {
      output.innerText = e.target.value;
      valueSlide = e.target.value;
      await drawText();
      console.log('aaa');
    }

    drawText();
